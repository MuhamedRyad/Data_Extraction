[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-data-extraction-feature"
version = "0.24.0"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "Pillow>=10,<13", "pydantic>=2.10,<3"]

[project.optional-dependencies]
docling = ["docling>=2.0,<3"]
unstructured = ["unstructured[pdf]>=0.15,<1"]
ocr = ["pytesseract>=0.3.10,<1"]
easyocr = ["easyocr>=1.7,<2", "numpy>=1.26,<3"]
openai = ["httpx>=0.27,<1"]
dev = ["pytest>=8,<10", "reportlab>=4,<5", "httpx>=0.27,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
include = ["data_extraction*"]

[tool.pytest.ini_options]
testpaths = ["tests", "data_extraction"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
